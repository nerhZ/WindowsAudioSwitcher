name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        shell: bash
        run: |
          # Cargo.toml is the single version source of truth; the MSI version,
          # installer name and update manifest all derive from it. Rewrite it
          # to the tag (v1.0.0 -> 1.0.0) so releases only need a tag, no bump.
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^version = .*/version = \"${VERSION}\"/" src-tauri/Cargo.toml
            echo "Cargo.toml version -> ${VERSION}"
          else
            echo "Not a tag ref (${GITHUB_REF_NAME}); keeping repository version"
          fi

      - name: Build and bundle
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Write and sign update manifest
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/msi
          VERSION="${GITHUB_REF_NAME#v}"
          MSI="Windows Audio Switcher_${VERSION}_x64_en-US.msi"
          SIG="Windows Audio Switcher_${VERSION}_x64_en-US.msi.sig"
          SIG_CONTENT=$(cat "$SIG")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Spaces in the artifact name must be percent-encoded in the URL
          # (reqwest/GitHub reject raw spaces in request URIs).
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${MSI// /%20}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG_CONTENT}",
                "url": "${URL}"
              }
            }
          }
          EOF
          bun run tauri signer sign latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Tags containing a hyphen (v1.0.0-1) are marked as GitHub
          # pre-releases; /releases/latest/ then keeps pointing at the latest
          # stable release, so pre-release manifests never reach stable
          # installs through the update endpoint.
          # NOTE: MSI ProductVersion must be numeric, so pre-release tags need
          # numeric ids (v1.1.0-1) - v1.1.0-beta.1 fails the bundler.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/msi/latest.json
            src-tauri/target/release/bundle/msi/latest.json.sig
